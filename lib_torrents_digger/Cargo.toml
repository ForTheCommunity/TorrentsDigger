[package]
name = "lib_torrents_digger"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
include_dir = "0.7.4"
once_cell = "1.21.4"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
regex = "1.13.1"
rsdns = { version = "0.23.0", features = ["net-std"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
rusqlite_migration = { version = "2.6.0", features = ["from-directory"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ua_generator = "0.5.87"
ureq = { version = "3.5.0", features = ["rustls","socks-proxy"] }
urlencoding = "2.1.3"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
noyalib = "0.0.58"
